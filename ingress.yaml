apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: week7-demo-ingress
  namespace: week7-demo
spec:
  ingressClassName: nginx
  rules:
    - host: week7.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: week7-demo-service
                port:
                  number: 80
