apiVersion: apps/v1
kind: Deployment
metadata:
  name: week7-demo-deployment
  namespace: week7-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: week7-demo
  template:
    metadata:
      labels:
        app: week7-demo
    spec:
      containers:
        - name: nginx
          image: nginx:stable
          ports:
            - containerPort: 80
